[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-afnet"
version = "0.1.0"
description = "Multi-patch attention and hybrid fusion for LUNA16 false-positive reduction"
authors = [{name = "Vamsi Krishna Vipparla"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "SimpleITK>=2.3,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
evaluation = ["matplotlib>=3.8,<4", "scikit-learn>=1.4,<2"]

[project.urls]
Repository = "https://github.com/vamsivipparla/mp-afnet"
Paper = "https://doi.org/10.4236/jcc.2021.94001"

[project.scripts]
mp-afnet = "lung_attention.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
